<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Colores principales */
        :root {
            --verde-primario: #4caf50; /* Botón principal, encabezados */
            --verde-oscuro: #388e3c;   /* Hover del botón, bordes */
            --verde-claro: #a5d6a7;    /* Fondos claros, acentos */
            --fondo-general: #e8f5e9;  /* Fondo general de la página */
            --gris-texto: #555;        /* Color de texto secundario */
            --blanco: #ffffff;         /* Fondo del contenedor */
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--fondo-general); /* Fondo verde muy claro */
        }

        .pedido-container {
            background-color: var(--blanco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 60%;
            margin: 30px auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pedido-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: var(--verde-primario);
            font-size: 2.4em;
            margin-bottom: 20px;
        }

        .pedido-detail {
            margin-bottom: 15px;
        }

        .pedido-detail label {
            font-weight: bold;
            color: var(--gris-texto);
            display: block;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .pedido-detail span {
            display: block;
            padding: 12px;
            background-color: var(--verde-claro);
            border-radius: 5px;
            color: var(--verde-oscuro);
            font-size: 1em;
            border: 1px solid var(--verde-oscuro);
        }

        .btn-volver {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 12px 24px;
            background-color: var(--verde-primario);
            color: white;
            text-decoration: none;
            font-size: 1em;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-volver:hover {
            background-color: var(--verde-oscuro);
            transform: translateY(-2px);
        }

        .btn-volver:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="pedido-container">
        <h1>Detalle del Pedido</h1>

        <!-- Información del Pedido -->
        <div class="pedido-detail">
            <label for="idPedido">ID Pedido:</label>
            <span id="idPedido">idPedido</span>
        </div>
        <div class="pedido-detail">
            <label for="restaurante">Restaurante:</label>
            <span id="restaurante">restaurante</span>
        </div>
        <div class="pedido-detail">
            <label for="producto">Producto:</label>
            <span id="producto">producto</span>
        </div>
        <div class="pedido-detail">
            <label for="monto">Monto:</label>
            <span id="monto">monto</span>
        </div>
        <div class="pedido-detail">
            <label for="estado">Estado:</label>
            <span id="estado">estado</span>
        </div>
        <div class="pedido-detail">
            <label for="tiempoRestante">Tiempo Restante:</label>
            <span id="tiempoRestante">tiempoRestante</span>
        </div>
        <div class="pedido-detail">
            <label for="detalle">Detalles:</label>
            <span id="detalle">detalle</span>
        </div>

        <a href="index.html" class="btn-volver">Volver</a>
    </div>
</body>
</html>
