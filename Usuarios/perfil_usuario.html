<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="perfil-container">
        <img src="default-profile.png" alt="Perfil">
        <h2 id="nombreUsuario">Nombre del usuario</h2>
        <p id="correoUsuario">Correo del usuario</p>
        <div class="pedidos">
            <h3>Pedidos en Curso:</h3>
            <div id="listaPedidosEnCurso"></div>
        </div>
        <div class="pedidos" id="pedidosCompletadosContainer">
            <p id="pedidosCompletados"></p>
        </div>
    </div>

    <script src="usuarios.js"></script>
</body>
</html>
